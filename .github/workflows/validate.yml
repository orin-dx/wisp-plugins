name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: extractions/setup-just@v4

      - name: Install pinned tooling dependencies
        run: just install

      - name: Validate plugin manifests
        run: just manifests

      - name: Run test suite
        run: just test

      - name: Check version consistency
        run: just versions

      - name: Check skill doc accuracy
        run: just skills-doc

      - name: Check reference file size
        run: just reference-size

      - name: Check cross-references and platform description limits
        run: just platform-limits

      - name: Confirm generated Claude plugin manifests are current
        run: just claude-manifests

      - name: Confirm generated Codex marketplace is current
        run: just marketplace-check

      - name: Check Mermaid diagram syntax
        run: just mermaid

      - name: Source wiring
        run: just wiring

      # just fmt-check is not yet in `just check`: the repo isn't formatted
      # with oxfmt yet. Add this step back once that lands.
